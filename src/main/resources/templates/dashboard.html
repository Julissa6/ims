<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dashboard</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #f4f6f9; }
        
        
        .header {
            background: #2c3e50;
            color: white;
            padding: 15px 20px;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            box-sizing: border-box;
        }

        
        .sidebar {
            width: 220px;
            height: 100vh;
            position: fixed;
            top: 0; 
            left: 0;
            background: #34495e; 
            color: white;
            padding: 80px 20px 20px 20px; 
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        .sidebar h3 { font-size: 1.2rem; margin-bottom: 30px; }
        .sidebar a {
            display: block;
            color: #bdc3c7;
            padding: 12px 0;
            text-decoration: none;
            transition: 0.3s;
        }
        .sidebar a:hover { color: white; }

        
        .logout-container {
            margin-top: auto; 
            padding-bottom: 20px;
        }

        
        .main {
            margin-left: 220px;
            padding: 20px;
            margin-top: 60px; 
        }

        .card {
            display: inline-block;
            width: 200px;
            padding: 25px;
            margin: 10px;
            color: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .blue { background: #3498db; }
        .green { background: #2ecc71; }
        .orange { background: #e67e22; }
    </style>
</head>
<body>

<div class="header">
    Welcome, <span th:text="${user}"></span>
</div>

<div class="sidebar">
    <h3>Inventory Management System AIRTEL</h3>
    <a href="/dashboard">Dashboard</a>
    <a href="/devices">Devices</a>
    <a href="/employees">Employees</a>
    <a href="/assign-device">Assign</a>
    <a href="/audit">Audit</a>
    <div style="text-align:center; margin-top:20px;">
    <a href="/devices" class="btn-home">View Devices</a>
</div>

    <div class="logout-container">
        <hr style="border: 0; border-top: 1px solid #5d6d7e; margin-bottom: 10px;">
        <a href="/logout" style="color: #e74c3c; font-weight: bold;">Logout</a>
    </div>
</div>

<div class="main">
    <h2>Dashboard</h2>

    <div class="card blue">
        Total Devices<br>
        <h2 style="margin: 5px 0 0 0;" th:text="${total}">2</h2>
    </div>

    <div class="card orange">
        Assigned<br>
        <h2 style="margin: 5px 0 0 0;" th:text="${assigned}">1</h2>
    </div>

    <div class="card green">
        Available<br>
        <h2 style="margin: 5px 0 0 0;" th:text="${available}">1</h2>
    </div>
</div>

</body>
</html>

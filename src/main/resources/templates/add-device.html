<!DOCTYPE html>
<html>
<head>
    <title>Add Device</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #eef2f3, #dfe9f3);
            margin: 0;
            padding: 0;
        }

        .container {
            width: 420px;
            margin: 80px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 15px;
            color: skyblue;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
            color: #555;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        input:focus, select:focus {
            border-color: #17a2b8;
            outline: none;
            box-shadow: 0 0 5px rgba(23,162,184,0.3);
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            border: none;
            background: #17a2b8;
            color: white;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #138496;
        }

        /* ✅ Back button */
        .btn-home {
            display: block;
            text-align: center;
            margin-bottom: 20px;
            padding: 10px;
            background: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }

        .btn-home:hover {
            background: #1e7e34;
        }
    </style>

</head>
<body>

<div class="container">

    <!-- ✅ BACK TO HOME BUTTON -->
    <a href="/dashboard" class="btn-home">← Back to Home</a>

    <h2>Add Device</h2>

    <form action="/save-device" method="post">

        <label>Name:</label>
        <input name="name" placeholder="Enter device name" required>

        <label>Type:</label>
        <input name="type" placeholder="Enter device type" required>

        <label>Serial Number:</label>
        <input name="serialNumber" placeholder="Enter serial number" required>

        <label>Condition:</label>
        <select name="condition" required>
            <option value="">-- Select Condition --</option>
            <option value="New">New</option>
            <option value="Good">Good</option>
            <option value="Fair">Fair</option>
            <option value="Damaged">Damaged</option>
        </select>

        <button type="submit">Save Device</button>

    </form>

</div>

</body>
</html>

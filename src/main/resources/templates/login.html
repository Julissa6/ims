<!DOCTYPE html>
<html>
<head>
<title>Login</title>

<style>
body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 350px;
    background: #ffffff;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
}

h2 {
    text-align: center;
    margin-bottom: 25px;
    color: #2c3e50;
}

label {
    font-weight: bold;
    font-size: 14px;
    color: #555;
}

input {
    width: 100%;
    padding: 12px;
    margin-top: 5px;
    margin-bottom: 15px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 14px;
}

input:focus {
    border-color: #3498db;
    outline: none;
    box-shadow: 0 0 5px rgba(52,152,219,0.3);
}

button {
    width: 100%;
    padding: 12px;
    background: #3498db;
    border: none;
    color: white;
    font-size: 16px;
    border-radius: 6px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #2980b9;
}

.info {
    margin-top: 15px;
    font-size: 13px;
    text-align: center;
    color: #777;
}

.info span {
    display: block;
    margin-top: 5px;
    color: #2c3e50;
    font-weight: bold;
}
</style>

</head>
<body>

<div class="container">

<h2> Login</h2>

<form action="/login" method="post">

    <label>Username</label>
    <input name="username" placeholder="Enter username" required>

    <label>Password</label>
    <input type="password" name="password" placeholder="Enter password" required>

    <button type="submit">Login</button>

    <div class="info">
        Default credentials:
        <span>Username: 24rp03639</span>
        <span>Password: 24rp06453</span>
    </div>

</form>

</div>

</body>
</html>
